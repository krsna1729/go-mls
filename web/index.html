<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Go-MLS Streaming Control</title>
    <meta name="description" content="Go-MLS streaming control panel for managing video relays and recordings">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="/style.css?v=20260405j">
</head>
<body>
    <header>
        <h1>Go-MLS Control Panel</h1>
    </header>
    <main>
        <nav role="tablist" style="margin-bottom:1em; display:flex; gap:16px;" aria-label="Main navigation tabs">
            <button id="tabStreams" class="tab-btn md-btn active" role="tab" 
                    aria-selected="true" aria-controls="streamsTab">
                Streams
            </button>
            <button id="tabRecordings" class="tab-btn md-btn" role="tab" 
                    aria-selected="false" aria-controls="recordingsTab">
                Recordings
            </button>
        </nav>
        <div id="streamsTab" tabindex="0" role="tabpanel" aria-labelledby="tabStreams">
            <div id="controls"></div>
        </div>
        <div id="recordingsTab" style="display:none" tabindex="0" role="tabpanel" aria-labelledby="tabRecordings"></div>
    </main>
    <!-- Video Player Modal -->
    <div id="videoPlayerModal" class="modal" style="display:none;">
        <div class="modal-content">
            <button id="closeVideoModal" class="modal-close" aria-label="Close video player"><span class="material-icons">close</span></button>
            <video id="inputVideoPlayer" controls autoplay style="width:100%;max-height:70vh;outline:none;" tabindex="0"></video>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
    <!-- JavaScript Modules - loaded first -->
    <script src="/modules/state.js?v=20260405k"></script>
    <script src="/modules/api.js?v=20260405k"></script>
    <script src="/modules/utils.js?v=20260405k"></script>
    <!-- Main application scripts -->
    <script src="/app.js?v=20260405k"></script>
    <script src="/recordings.js?v=20260405k"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const tabStreams = document.getElementById('tabStreams');
        const tabRecordings = document.getElementById('tabRecordings');
        const streamsTab = document.getElementById('streamsTab');
        const recordingsTab = document.getElementById('recordingsTab');
        
        function switchTab(activeTab, inactiveTab, activePanel, inactivePanel) {
            // Update ARIA attributes
            activeTab.setAttribute('aria-selected', 'true');
            inactiveTab.setAttribute('aria-selected', 'false');
               activePanel.setAttribute('aria-hidden', 'false');
               inactivePanel.setAttribute('aria-hidden', 'true');
               activePanel.removeAttribute('inert');
               inactivePanel.setAttribute('inert', '');
            
            // Update visual state
            activeTab.classList.add('active');
            inactiveTab.classList.remove('active');
            
            // Show/hide panels
            activePanel.style.display = '';
            inactivePanel.style.display = 'none';
            
            // Focus the active panel for screen readers
            activePanel.focus();
        }
        
        tabStreams.onclick = function () {
            switchTab(tabStreams, tabRecordings, streamsTab, recordingsTab);
        };
        
        tabRecordings.onclick = function () {
            switchTab(tabRecordings, tabStreams, recordingsTab, streamsTab);
        };
        
        // Keyboard navigation support
        tabStreams.onkeydown = tabRecordings.onkeydown = function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                this.click();
            }
        };
        
            // Initial accessibility state for inactive tab panel.
            recordingsTab.setAttribute('aria-hidden', 'true');
            recordingsTab.setAttribute('inert', '');
    });
    </script>
</body>
</html>
