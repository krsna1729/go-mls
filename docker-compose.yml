services:
  # ============================================================================
  # go-mls: RTMP hub + HTTP API
  # Ports driven by config.json: http.port=8080, rtmp_hub.port=1935
  # ============================================================================
  go-mls:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-mls
    ports:
      - "8080:8080"  # HTTP API (config.http.port)
    volumes:
      - ./config.json:/app/config.json:ro
      - ./web:/app/web:ro
      - ./testdata:/testdata:ro
      - ./recordings:/recordings
      - ./hls:/hls
    environment:
      - GOLOG_LEVEL=info
    networks:
      - media-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/stats"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # ============================================================================
  # qa-harness: Single-container source/sink/test runner for deterministic E2E
  # Keeps go-mls separate while synchronously controlling input/output lifecycle
  # ============================================================================
  qa-harness:
    build:
      context: .
      dockerfile: Dockerfile
      target: qa-harness
    container_name: qa-harness
    networks:
      - media-net
    depends_on:
      go-mls:
        condition: service_healthy
    volumes:
      - ./test-results:/results
      - ./testdata:/testdata:ro
      - ./relay_config.json:/relay_config.json:ro
      - ./scripts/e2e-test.sh:/e2e-test.sh:ro
    entrypoint: ["/bin/sh", "/e2e-test.sh"]
    restart: "no"

networks:
  media-net:
    driver: bridge
