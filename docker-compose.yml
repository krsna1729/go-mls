services:
  # ============================================================================
  # go-mls: RTMP hub + HTTP API
  # Ports driven by config.json: http.port=8080, rtmp_hub.port=1935
  # ============================================================================
  go-mls:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-mls
    ports:
      - "8080:8080"  # HTTP API (config.http.port)
    volumes:
      - ./config.json:/app/config.json:ro
      - ./testdata:/testdata:ro
      - ./recordings:/recordings
      - ./hls:/hls
    environment:
      - GOLOG_LEVEL=info
    networks:
      - media-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/stats"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # ============================================================================
  # source-rtmp: RTMP source server - hosts test video for go-mls pull mode
  # Runs nginx-rtmp + ffmpeg from the dedicated Dockerfile stage
  # ============================================================================
  source-rtmp:
    build:
      context: .
      dockerfile: Dockerfile
      target: source-rtmp
    container_name: source-rtmp
    networks:
      - media-net
    volumes:
      - ./testdata:/testdata:ro
      - ./scripts/source-rtmp.sh:/source-rtmp.sh:ro
    entrypoint: ["/bin/sh", "/source-rtmp.sh"]

  # ============================================================================
  # source-push: FFmpeg pushing to go-mls RTMP hub (port 1935)
  # Auto-starts and registers input via API
  # ============================================================================
  source-push:
    build:
      context: .
      dockerfile: Dockerfile
      target: source-push
    container_name: source-push
    volumes:
      - ./testdata:/testdata:ro
      - ./scripts/source-push.sh:/source-push.sh:ro
    networks:
      - media-net
    entrypoint: ["/bin/sh", "/source-push.sh"]
    depends_on:
      go-mls:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "pgrep", "-x", "ffmpeg"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # output-rtmp: Receives relayed streams (port 1935)
  # ============================================================================
  output-rtmp:
    image: tiangolo/nginx-rtmp:latest
    container_name: output-rtmp
    networks:
      - media-net
    deploy:
      resources:
        limits:
          memory: 64m

  # ============================================================================
  # test-runner: Comprehensive e2e tests using ffprobe for verification
  # ============================================================================
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: test-runner
    container_name: test-runner
    networks:
      - media-net
    depends_on:
      go-mls:
        condition: service_healthy
    volumes:
      - ./test-results:/results
      - ./testdata:/testdata:ro
      - ./scripts/e2e-test.sh:/e2e-test.sh:ro
    entrypoint: ["/bin/sh", "/e2e-test.sh"]

networks:
  media-net:
    driver: bridge
